name: add-assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-assets.yml'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write image files from assets.js
        run: |
          node -e "
          const fs = require('fs');
          global.window = {};
          eval(fs.readFileSync('assets.js', 'utf8'));
          fs.mkdirSync('assets', { recursive: true });
          const out = { logo: 'logo.png', favicon: 'favicon.png', photo: 'photo.jpg' };
          for (const k of Object.keys(out)) {
            fs.writeFileSync('assets/' + out[k], Buffer.from(window.ASSETS[k].split(',')[1], 'base64'));
          }
          "
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets
          git commit -m "Add image files to assets" || echo "nothing to commit"
          git push
